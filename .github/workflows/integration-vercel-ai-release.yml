name: Vercel AI SDK integration release

# Push a tag to publish @vaquill-ai/ai-sdk. Nothing publishes without a reviewer approving the
# protected GitHub Environment named "npm-ai-sdk".
#
#   ai-sdk-v0.1.0-rc.1 (any -suffix)  ->  npm dist-tag "next" (pre-release channel)
#   ai-sdk-v0.1.0                     ->  npm dist-tag "latest"
#
# Independent of js-release.yml (js-v* tags, @vaquill-ai/sdk): one repository, separate releases.
# Publish @vaquill-ai/sdk first when this package needs a newer one than npm already has.
#
# Auth is npm TRUSTED PUBLISHING over OIDC. No npm token secret is used or needed anywhere in this workflow.
# The owner must configure the trusted publisher on npmjs.com once (RELEASING.md in
# integrations/vercel-ai/): this repository, workflow "integration-vercel-ai-release.yml",
# environment "npm-ai-sdk". npm needs 11.5.1 or newer for it.
on:
  push:
    tags: ["ai-sdk-v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Full package CI on the tagged commit
    uses: ./.github/workflows/integration-vercel-ai-ci.yml
    permissions:
      contents: read

  build:
    name: Build tarball
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
      version: ${{ steps.classify.outputs.version }}
    defaults:
      run:
        working-directory: integrations/vercel-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Classify the tag and verify it
        id: classify
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^ai-sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=latest
          elif [[ "$TAG" =~ ^ai-sdk-v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            channel=next
          else
            echo "::error::Tag '$TAG' is not ai-sdk-vX.Y.Z or a semver pre-release (ai-sdk-vX.Y.Z-rc.1)"
            exit 1
          fi
          version="${TAG#ai-sdk-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::Tag is $version but package.json is '$pkg_version'"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit is not on $DEFAULT_BRANCH"
            exit 1
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: publint and Are the types wrong
        run: npm run lint:package
      - name: Pack
        run: |
          mkdir pack
          npm pack --pack-destination pack
          sha256sum pack/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack
          path: integrations/vercel-ai/pack/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm (${{ needs.build.outputs.channel }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm-ai-sdk
      url: https://www.npmjs.com/package/@vaquill-ai/ai-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack
          path: pack/
      # package.json needs a "repository" field that matches this GitHub repo exactly,
      # or provenance signing fails. No token is set: npm authenticates with the job's OIDC
      # identity against the trusted publisher configured on npmjs.com.
      - name: npm publish with provenance (trusted publishing)
        env:
          DIST_TAG: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
          npm publish ./pack/*.tgz --provenance --access public --tag "$DIST_TAG"

  github-release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack
          path: pack/
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [ "$CHANNEL" = next ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" pack/* "${args[@]}"
