name: Java release

# Push a tag to publish. Nothing publishes without a reviewer approving the
# protected GitHub Environment named "maven-central".
#
#   java-v0.1.0        ->  Maven Central, GitHub Release (stable)
#   java-v0.1.0-rc.1   ->  Maven Central, GitHub Release marked pre-release
#
# The tag must equal the <version> in java/pom.xml. SNAPSHOT versions are refused.
# A Maven Central release cannot be deleted or overwritten, so read java/RELEASING.md first.
#
# The Python and JavaScript packages have their own workflows and tags
# (python-v*, js-v*): one repository, independent releases.
#
# Secrets (all on the "maven-central" environment, none at repository level):
#   MAVEN_GPG_PRIVATE_KEY   ASCII armored private key (gpg --armor --export-secret-keys)
#   MAVEN_GPG_PASSPHRASE    its passphrase
#   CENTRAL_TOKEN_USERNAME  Sonatype Central Portal user token, username half
#   CENTRAL_TOKEN_PASSWORD  Sonatype Central Portal user token, password half
on:
  push:
    tags: ["java-v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Full Java CI on the tagged commit
    uses: ./.github/workflows/java-ci.yml
    permissions:
      contents: read

  build:
    name: Verify tag and build unsigned artifacts
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      version: ${{ steps.classify.outputs.version }}
      contract: ${{ steps.classify.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Classify the tag and verify it
        id: classify
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^java-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$TAG" =~ ^java-v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            prerelease=true
          else
            echo "::error::Tag '$TAG' is not java-vX.Y.Z or a pre-release (java-vX.Y.Z-rc.1)"
            exit 1
          fi
          version="${TAG#java-v}"
          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "::error::SNAPSHOT versions are never released"
            exit 1
          fi
          pom_version="$(mvn -q -B -ntp -f java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$pom_version" != "$version" ]; then
            echo "::error::Tag is $version but java/pom.xml is '$pom_version'"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit is not on $DEFAULT_BRANCH"
            exit 1
          fi
          contract="$(grep -v '^[[:space:]]*#' CONTRACT_VERSION | head -n 1 | tr -d '[:space:]')"
          {
            echo "prerelease=$prerelease"
            echo "version=$version"
            echo "contract=$contract"
          } >> "$GITHUB_OUTPUT"
      # Dry run of everything except signing and upload, before a reviewer is asked.
      - name: Build main, sources and javadoc jars (no signing)
        working-directory: java
        run: mvn -B -ntp -Prelease -Dgpg.skip=true -DskipTests verify
      - name: Check the three jars exist
        working-directory: java
        env:
          VERSION: ${{ steps.classify.outputs.version }}
        run: |
          set -euo pipefail
          for f in "vaquill-sdk-$VERSION.jar" "vaquill-sdk-$VERSION-sources.jar" "vaquill-sdk-$VERSION-javadoc.jar"; do
            test -s "target/$f" || { echo "::error::target/$f is missing"; exit 1; }
          done
          sha256sum target/*.jar | tee -a "$GITHUB_STEP_SUMMARY"

  publish-central:
    name: Sign and publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/ai.vaquill/vaquill-sdk/${{ needs.build.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Writes ~/.m2/settings.xml with server "central" (read from the env vars below)
      # and imports the GPG key. The passphrase is read from MAVEN_GPG_PASSPHRASE.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Tests already ran in the "checks" job on this exact commit.
      - name: Sign and deploy
        working-directory: java
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-artifacts
          path: |
            java/target/*.jar
            java/target/*.asc
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    needs: [build, publish-central]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-artifacts
          path: dist/
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          CONTRACT: ${{ needs.build.outputs.contract }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG" --generate-notes --notes "API contract version: ${CONTRACT}")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${args[@]}"
