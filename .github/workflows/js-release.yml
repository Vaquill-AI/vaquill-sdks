name: JS release

# Push a tag to publish. Nothing publishes without a reviewer approving the
# protected GitHub Environment named "npm".
#
#   js-v0.1.0-rc.1 (any -suffix)  ->  npm dist-tag "next" (pre-release channel)
#   js-v0.1.0                     ->  npm dist-tag "latest"
#
# The Python package has its own workflow and tags (python-v*): one repository,
# two independent releases.
#
# Auth, option A (default, used while trusted publishing is not enabled for the
# new package): a granular npm publish token stored as the environment secret
# NPM_TOKEN on the "npm" environment. Provenance is still attached through the
# job's OIDC token (id-token: write).
#
# Auth, option B (preferred once available): npm trusted publishing. Configure the
# package on npmjs.com with this repository, workflow "js-release.yml" and environment
# "npm", then delete the NPM_TOKEN secret. The publish step already skips the token
# when NPM_TOKEN is empty and npm falls back to OIDC (needs npm 11.5.1 or newer).
on:
  push:
    tags: ["js-v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Full CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    with:
      only: js
    permissions:
      contents: read

  build:
    name: Build tarball
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
      version: ${{ steps.classify.outputs.version }}
      contract: ${{ steps.classify.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Classify the tag and verify it
        id: classify
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^js-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=latest
          elif [[ "$TAG" =~ ^js-v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            channel=next
          else
            echo "::error::Tag '$TAG' is not js-vX.Y.Z or a semver pre-release (js-vX.Y.Z-rc.1)"
            exit 1
          fi
          version="${TAG#js-v}"
          pkg_version="$(node -p "require('./js/package.json').version")"
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::Tag is $version but package.json is '$pkg_version'"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit is not on $DEFAULT_BRANCH"
            exit 1
          fi
          contract="$(grep -v '^[[:space:]]*#' CONTRACT_VERSION | head -n 1 | tr -d '[:space:]')"
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "contract=$contract"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm run lint:package
        working-directory: js
      - name: Pack
        working-directory: js
        run: |
          mkdir pack
          npm pack --pack-destination pack
          sha256sum pack/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack
          path: js/pack/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm (${{ needs.build.outputs.channel }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@vaquill-ai/sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack
          path: pack/
      # package.json needs a "repository" field that matches this GitHub repo exactly,
      # or provenance signing fails.
      - name: npm publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          fi
          npm --version
          npm publish ./pack/*.tgz --provenance --access public --tag "$DIST_TAG"

  github-release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack
          path: pack/
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          CONTRACT: ${{ needs.build.outputs.contract }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG" --generate-notes --notes "API contract version: ${CONTRACT}")
          if [ "$CHANNEL" = next ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" pack/* "${args[@]}"
