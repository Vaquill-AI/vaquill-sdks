name: Python release

# Push a tag to publish. Nothing publishes without a reviewer approving the
# protected GitHub Environment named "pypi".
#
#   python-v0.1.0a1 / b2 / rc1  ->  PyPI as a PEP 440 pre-release (pip skips it only once a stable version exists)
#   python-v0.1.0               ->  PyPI (stable)
#
# There is no TestPyPI step (owner decision 2026-10-29).
#
# The JavaScript package has its own workflow and tags (js-v*): one repository,
# two independent releases.
#
# Auth: PyPI Trusted Publishing (OIDC). No API token is stored anywhere.
# The trusted publisher on pypi.org (and on test.pypi.org) must name this
# repository, the workflow file "python-release.yml" and the environment "pypi".
on:
  push:
    tags: ["python-v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Full CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    with:
      only: python
    permissions:
      contents: read

  build:
    name: Build distributions
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      version: ${{ steps.classify.outputs.version }}
      contract: ${{ steps.classify.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the tag and verify it
        id: classify
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^python-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$TAG" =~ ^python-v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            prerelease=true
          else
            echo "::error::Tag '$TAG' is not python-vX.Y.Z or a PEP 440 pre-release (aN, bN, rcN)"
            exit 1
          fi
          version="${TAG#python-v}"
          file_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/vaquill/_version.py)"
          if [ "$file_version" != "$version" ]; then
            echo "::error::Tag is $version but python/src/vaquill/_version.py is '$file_version'"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit is not on $DEFAULT_BRANCH"
            exit 1
          fi
          contract="$(grep -v '^[[:space:]]*#' CONTRACT_VERSION | head -n 1 | tr -d '[:space:]')"
          {
            echo "prerelease=$prerelease"
            echo "version=$version"
            echo "contract=$contract"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check
        working-directory: python
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/vaquill/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          CONTRACT: ${{ needs.build.outputs.contract }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG" --generate-notes --notes "API contract version: ${CONTRACT}")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${args[@]}"
