version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-updates:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-updates:
        patterns: ["*"]
