[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-vaquill"
dynamic = ["version"]
description = "LangChain tools, toolkit and retriever for the Vaquill US primary law Data API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The vaquill SDK itself requires Python 3.11 (typing.Unpack).
requires-python = ">=3.11"
dependencies = ["langchain-core>=0.3.36,<2", "vaquill>=0.2.0,<1", "pydantic>=2.7.4,<3"]
authors = [{ name = "Vaquill" }]
keywords = ["langchain", "langgraph", "vaquill", "legal", "law", "statutes", "retriever", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.vaquill.ai"
Documentation = "https://www.vaquill.ai/docs/api-guide/sdks/overview"
Source = "https://github.com/Vaquill-AI/vaquill-sdks/tree/main/integrations/langchain"
Issues = "https://github.com/Vaquill-AI/vaquill-sdks/issues"

[project.optional-dependencies]
agents = ["langchain>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "langchain>=1.0"]

[tool.hatch.version]
path = "src/langchain_vaquill/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_vaquill"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/LICENSE", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --cov=langchain_vaquill --cov-report=term-missing"
markers = ["live: calls the real Vaquill API and spends credits; needs VAQUILL_API_KEY and --run-live via -m live"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Tool descriptions are long model-facing strings.
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
